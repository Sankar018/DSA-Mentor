<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSA Mentor — Ask the Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#173327;
    --board-dark:#102420;
    --chalk:#EEE9DC;
    --chalk-dim:#B9C4B9;
    --chalk-yellow:#E8C468;
    --chalk-blue:#7FB0C4;
    --chalk-pink:#CC8B8F;
    --wood:#4A3423;
    --wood-dark:#33251A;
    --radius:3px;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at top left, rgba(255,255,255,0.03), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(255,255,255,0.02), transparent 55%),
      var(--board);
    background-blend-mode:screen;
    font-family:'Inter', sans-serif;
    color:var(--chalk);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  /* subtle chalk-dust grain */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:0.05;
    background-image:
      radial-gradient(circle, #fff 1px, transparent 1px);
    background-size:3px 3px;
  }

  .frame{
    width:100%;
    max-width:760px;
    border:14px solid var(--wood);
    border-radius:8px;
    background:linear-gradient(180deg, var(--board) 0%, var(--board-dark) 100%);
    box-shadow:
      0 0 0 3px var(--wood-dark),
      0 30px 60px -20px rgba(0,0,0,0.6),
      inset 0 0 80px rgba(0,0,0,0.35);
    display:flex;
    flex-direction:column;
    height:88vh;
    max-height:820px;
    overflow:hidden;
  }

  header{
    padding:22px 26px 14px;
    flex-shrink:0;
  }

  header .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--chalk-blue);
    opacity:0.85;
  }

  header h1{
    font-family:'Kalam', cursive;
    font-weight:700;
    font-size:32px;
    margin:4px 0 2px;
    color:var(--chalk);
    text-shadow:0 0 14px rgba(238,233,220,0.15);
  }

  header p{
    margin:0;
    font-size:13px;
    color:var(--chalk-dim);
    font-family:'Inter', sans-serif;
  }

  .chalk-divider{
    height:2px;
    margin:16px 0 0;
    background-image:repeating-linear-gradient(
      90deg, var(--chalk-dim) 0 10px, transparent 10px 18px
    );
    opacity:0.35;
  }

  #log{
    flex:1;
    overflow-y:auto;
    padding:22px 26px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }

  #log::-webkit-scrollbar{ width:8px; }
  #log::-webkit-scrollbar-thumb{ background:rgba(238,233,220,0.15); border-radius:4px; }

  .row{
    display:flex;
    flex-direction:column;
    max-width:82%;
    animation:chalkIn 0.35s ease;
  }
  .row.user{ align-self:flex-end; align-items:flex-end; }
  .row.bot{ align-self:flex-start; align-items:flex-start; }

  @keyframes chalkIn{
    from{ opacity:0; transform:translateY(6px); filter:blur(2px); }
    to{ opacity:1; transform:translateY(0); filter:blur(0); }
  }

  .bubble{
    font-family:'JetBrains Mono', monospace;
    font-size:13.5px;
    line-height:1.55;
    padding:11px 14px;
    border-radius:var(--radius);
    white-space:pre-wrap;
    word-break:break-word;
  }

  .row.user .bubble{
    border:1.5px solid var(--chalk-yellow);
    color:var(--chalk-yellow);
    background:rgba(232,196,104,0.06);
  }

  .row.bot .bubble{
    border:1.5px solid var(--chalk-blue);
    color:var(--chalk);
    background:rgba(127,176,196,0.06);
  }

  /* array-index tag under each bubble — the signature element */
  .idx{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    margin-top:4px;
    opacity:0.55;
    letter-spacing:0.03em;
  }
  .row.user .idx{ color:var(--chalk-yellow); }
  .row.bot .idx{ color:var(--chalk-blue); }

  /* dashed pointer arrow connecting consecutive turns */
  .pointer{
    align-self:center;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--chalk-dim);
    opacity:0.4;
    margin:2px 0;
  }

  .typing .bubble{
    display:flex;
    gap:5px;
    align-items:center;
    min-width:46px;
  }
  .typing .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--chalk-blue);
    animation:blink 1.1s infinite ease-in-out;
  }
  .typing .dot:nth-child(2){ animation-delay:0.18s; }
  .typing .dot:nth-child(3){ animation-delay:0.36s; }
  @keyframes blink{
    0%,80%,100%{ opacity:0.25; transform:translateY(0); }
    40%{ opacity:1; transform:translateY(-2px); }
  }

  form{
    flex-shrink:0;
    display:flex;
    gap:10px;
    padding:16px 22px 20px;
    border-top:1px dashed rgba(238,233,220,0.18);
  }

  #input{
    flex:1;
    background:rgba(0,0,0,0.25);
    border:1.5px solid rgba(238,233,220,0.25);
    border-radius:var(--radius);
    color:var(--chalk);
    font-family:'JetBrains Mono', monospace;
    font-size:13.5px;
    padding:11px 13px;
    outline:none;
    transition:border-color 0.2s;
  }
  #input::placeholder{ color:var(--chalk-dim); opacity:0.6; }
  #input:focus{ border-color:var(--chalk-yellow); }

  button{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.02em;
    color:var(--board-dark);
    background:var(--chalk-yellow);
    border:none;
    border-radius:var(--radius);
    padding:0 20px;
    cursor:pointer;
    transition:transform 0.12s ease, box-shadow 0.12s ease;
  }
  button:hover{ transform:translateY(-1px); box-shadow:0 4px 14px rgba(232,196,104,0.3); }
  button:active{ transform:translateY(0); }
  button:disabled{ opacity:0.5; cursor:default; transform:none; box-shadow:none; }

  button:focus-visible, #input:focus-visible{
    outline:2px solid var(--chalk-yellow);
    outline-offset:2px;
  }

  .empty-state{
    margin:auto;
    text-align:center;
    color:var(--chalk-dim);
    font-family:'Inter', sans-serif;
    font-size:13px;
    max-width:320px;
    line-height:1.6;
  }
  .empty-state .arr{
    font-family:'JetBrains Mono', monospace;
    color:var(--chalk-blue);
    font-size:15px;
    margin-bottom:10px;
    opacity:0.8;
  }

  @media (prefers-reduced-motion: reduce){
    .row, .dot{ animation:none !important; }
  }

  @media (max-width: 560px){
    .frame{ height:94vh; border-width:8px; }
    header h1{ font-size:26px; }
    .row{ max-width:92%; }
  }
</style>
</head>
<body>

<div class="frame">
  <header>
    <div class="eyebrow">// office hours</div>
    <h1>DSA Mentor</h1>
    <p>Ask about arrays, trees, graphs, recursion, complexity — anything on the syllabus.</p>
    <div class="chalk-divider"></div>
  </header>

  <div id="log">
    <div class="empty-state" id="emptyState">
      <div class="arr">[ 0 ]&nbsp;&nbsp;[ 1 ]&nbsp;&nbsp;[ 2 ]&nbsp;&nbsp;[ ? ]</div>
      Start the conversation. Ask something like<br>"What is a stack?" or "Explain binary search."
    </div>
  </div>

  <form id="form">
    <input id="input" type="text" placeholder="e.g. What is an array?" autocomplete="off" />
    <button type="submit" id="sendBtn">Send</button>
  </form>
</div>

<script>
  const log = document.getElementById('log');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const emptyState = document.getElementById('emptyState');

  let turnIndex = 0;
  const BACKEND_URL = '/api/chat'; // Flask backend endpoint — see DSA.py

  function addRow(text, who){
    if(emptyState) emptyState.remove();

    if(turnIndex > 0){
      const p = document.createElement('div');
      p.className = 'pointer';
      p.textContent = '↓ next';
      log.appendChild(p);
    }

    const row = document.createElement('div');
    row.className = 'row ' + who;

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    const idx = document.createElement('div');
    idx.className = 'idx';
    idx.textContent = `[${turnIndex}] ${who === 'user' ? 'you' : 'mentor'}`;

    row.appendChild(bubble);
    row.appendChild(idx);
    log.appendChild(row);
    turnIndex++;

    log.scrollTop = log.scrollHeight;
    return bubble;
  }

  function addTyping(){
    const row = document.createElement('div');
    row.className = 'row bot typing';
    row.id = 'typingRow';
    row.innerHTML = `<div class="bubble">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>`;
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
  }

  function removeTyping(){
    const el = document.getElementById('typingRow');
    if(el) el.remove();
  }

  async function sendMessage(text){
    addRow(text, 'user');
    addTyping();
    sendBtn.disabled = true;

    try{
      const res = await fetch(BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });

      if(!res.ok){
        throw new Error(`Server responded ${res.status}`);
      }

      const data = await res.json();
      removeTyping();
      addRow(data.reply ?? 'Something went wrong — no reply received.', 'bot');
    }catch(err){
      removeTyping();
      addRow(`Board's down: ${err.message}. Is app.py running on this address?`, 'bot');
    }finally{
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if(!text) return;
    input.value = '';
    sendMessage(text);
  });
</script>

</body>
</html>
